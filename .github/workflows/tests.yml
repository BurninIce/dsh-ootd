name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          for file in lib/*.js; do
            node --check "$file"
          done
      - name: Unit tests
        run: npm test
      - name: Package contents
        run: npm pack --dry-run --json > /dev/null
